<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430"><rect width="960" height="430" rx="16" fill="#f4f8ff"/><g font-family="Arial, Microsoft JhengHei, sans-serif"><text x="30" y="46" font-size="26" fill="#173452" font-weight="bold">3 個加會區塊 · 兩種處理情境</text><rect x="24" y="72" width="912" height="171" rx="12" fill="white" stroke="#93bffa"/><text x="44" y="111" font-size="22" fill="#2563eb">A　需要加會</text><g font-size="19" fill="#173452"><text x="44" y="156">選擇其他單位主管</text><text x="272" y="156">→ 系統通知</text><text x="440" y="156">→ 對方處理並提交</text><text x="690" y="156">→ 回原經理</text></g><text x="44" y="212" font-size="20" fill="#b45309">被指派人提交前，流程不會回到原經理。</text><rect x="24" y="266" width="912" height="138" rx="12" fill="#eaf4ff" stroke="#93bffa"/><text x="44" y="308" font-size="22" fill="#2563eb">B　不需加會</text><text x="44" y="357" font-size="21" fill="#173452">直接提交該區塊 → 流程前往下一階段</text></g></svg>