<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430"><rect width="960" height="430" rx="16" fill="#f4f8ff"/><g font-family="Arial, Microsoft JhengHei, sans-serif"><rect x="18" y="18" width="924" height="48" rx="8" fill="#173452"/><text x="38" y="49" fill="white" font-size="22">經理指派 · 操作示意</text><rect x="22" y="86" width="540" height="322" rx="10" fill="white" stroke="#b5cff4"/><text x="42" y="122" font-size="20" fill="#173452">① 是否結案？　○ 是　● 否（預設）</text><text x="42" y="177" font-size="20" fill="#173452">② 選取承辦人姓名</text><rect x="42" y="193" width="492" height="53" rx="6" fill="#eff6ff" stroke="#2563eb"/><text x="61" y="227" font-size="21" fill="#2563eb">陳小明　 ▾</text><rect x="43" y="271" width="52" height="46" rx="8" fill="#2563eb"/><path d="M55 282h26v17H64l-9 7z" fill="none" stroke="white" stroke-width="2"/><text x="108" y="301" font-size="20" fill="#173452">③ 點開註解小圖示 →</text><text x="42" y="373" font-size="18" fill="#b45309">只選姓名不會寄送通知！</text><rect x="584" y="86" width="353" height="322" rx="10" fill="white" stroke="#2563eb"/><text x="607" y="122" font-size="21" fill="#173452">註解</text><rect x="604" y="150" width="311" height="155" rx="8" fill="#eff6ff"/><text x="620" y="188" font-size="21" fill="#2563eb">@陳小明</text><text x="620" y="224" font-size="18" fill="#173452">請確認來文並於期限前</text><text x="620" y="254" font-size="18" fill="#173452">完成回覆。</text><rect x="760" y="328" width="135" height="49" rx="8" fill="#2563eb"/><text x="784" y="360" font-size="20" fill="white">送出註解</text></g></svg>